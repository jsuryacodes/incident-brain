# Local stack: FalkorDB (+ Browser on :3000) and the app (UI + API) on :8000.   docker compose up --build
# The app seeds empty graphs and plays the demo story once on first start (SEED_ON_START=1, mock mode).
services:
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["127.0.0.1:6379:6379", "127.0.0.1:3000:3000"]  # no auth on FalkorDB: never publish it beyond localhost
    volumes: [falkordb-data:/var/lib/falkordb/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      SEED_ON_START: "1"
      PORT: "8000"
    depends_on:
      falkordb:
        condition: service_healthy
volumes:
  falkordb-data:
