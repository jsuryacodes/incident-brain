<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Incident Brain: an agent team that finds incident causes in a company graph, shows every query, and remembers." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Incident Brain</title>
    <script>
      // Set the theme before first paint (no flash). Choice: "system" | "light" | "dark", stored in localStorage.
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("ib.theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
